name: Build and attach dist to Release

on:
  release:
    types: [published]
  push:
    # Trigger on any tag push. Adjust pattern if you only want semantic tags e.g. 'v*'
    tags:
      - '*' 

jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Package dist
        run: |
          echo "Listing dist"
          ls -la dist || true
          # Determine tag name for zip filename
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name || 'release' }}"
          echo "Using tag: $TAG_NAME"
          cd dist
          zip -r ../dist-${TAG_NAME}.zip .

      - name: Create Release (if triggered by tag push)
        if: github.event_name == 'push'
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: Automated release created by workflow
          draft: false
          prerelease: false

      - name: Upload dist to Release
        uses: actions/upload-release-asset@v1
        with:
          # Use upload_url from the release event, or from the created release when triggered by push
          upload_url: ${{ github.event_name == 'release' && github.event.release.upload_url || steps.create_release.outputs.upload_url }}
          asset_path: ./dist-${{ github.event.release.tag_name || github.ref_name || 'release' }}.zip
          asset_name: dist-${{ github.event.release.tag_name || github.ref_name || 'release' }}.zip
          asset_content_type: application/zip
