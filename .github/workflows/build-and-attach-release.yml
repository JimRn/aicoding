name: Build and attach dist to Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Package dist
        run: |
          pwd
          ls -la dist || true
          cd dist
          zip -r ../dist-${{ github.event.release.tag_name || 'release' }}.zip .

      - name: Upload dist to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist-${{ github.event.release.tag_name || 'release' }}.zip
          asset_name: dist-${{ github.event.release.tag_name || 'release' }}.zip
          asset_content_type: application/zip
